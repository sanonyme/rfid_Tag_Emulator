name: CI

on:
  push:
    paths:
      - 'modern-ui/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'modern-ui/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: modern-ui

jobs:
  validate:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modern-ui/package-lock.json

      - name: Install Linux build tools for native modules
        run: sudo apt-get update && sudo apt-get install -y python3 make g++

      - run: npm ci

      - name: Run CI checks
        run: npm run ci
