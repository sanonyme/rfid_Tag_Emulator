<!doctype html><meta charset="utf-8"><title>Zeus Release Console</title><style>body{font:15px system-ui;background:#111827;color:#e5e7eb;max-width:820px;margin:40px auto;padding:0 20px}button{padding:12px 18px;margin:6px;border:0;border-radius:8px;background:#38bdf8;color:#082f49;font-weight:700;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}.step{border:1px solid #374151;border-radius:12px;padding:16px;margin:12px 0}pre{background:#030712;padding:14px;border-radius:8px;white-space:pre-wrap;max-height:360px;overflow:auto}</style><h1>Zeus Release Console</h1><p>Promotion workflow and staging-only test players.</p><div id="steps"></div><div class="step"><b>Staging developer players</b><p>Each player gets isolated localStorage, device ID, and session ID, and opens against staging.</p><button onclick="add(1)">Add player 1</button><button onclick="add(2)">Add player 2</button><button onclick="add(3)">Add player 3</button></div><pre id="log"></pre><script>const steps=[['build','Build artifact','Build the release bundle'],['stage','Deploy staging','Deploy the bundle to CT251 and health-check it'],['confirm','Confirm staging','Unlock production after testing'],['prod','Promote production','Snapshot, back up, deploy and health-check CT250']];let state={};const el=document.querySelector('#steps'),out=document.querySelector('#log');async function refresh(){state=await fetch('/api/state').then(r=>r.json());el.innerHTML=steps.map(([id,title,text])=>`<div class="step"><b>${title}</b><p>${text}</p><button ${id==='stage'&&!state.artifact?'disabled':''}${id==='confirm'&&!state.staging?'disabled':''}${id==='prod'&&!state.confirmed?'disabled':''} onclick="go('${id}')">${id==='confirm'?'Confirm staging':'Run'}</button></div>`).join('');out.textContent=(state.log||[]).join('\n')}async function go(id){await fetch('/api/'+id,{method:'POST'});refresh()}async function add(n){await fetch('/api/dev/add-player?n='+n,{method:'POST'});refresh()}refresh();setInterval(refresh,1500)</script>
