[package]
name = "zeus-rfid-emulator"
version = "9.1.1"
description = "Zeus RFID Tag Emulator"
authors = ["Anexya"]
edition = "2021"

[lib]
name = "zeus_rfid_emulator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process"] }
reqwest = { version = "0.12", features = ["json"] }
dirs = "5"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
machine-uid = "0.5"
mac_address = "1.1"
mysql_async = { version = "0.34", default-features = false, features = ["native-tls-tls"] }
hex = "0.4"
dotenvy = "0.15"
russh = "0.46"
russh-sftp = "2.3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
if-addrs = "0.13"
dns-lookup = "2"
portable-pty = "0.8"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
urlencoding = "2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true

# Faster incremental dev builds (especially link step on Windows).
[profile.dev]
incremental = true
codegen-units = 256
debug = 1
