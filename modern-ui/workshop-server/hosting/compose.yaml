services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: workshop
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop -d workshop"]
      interval: 10s
      timeout: 5s
      retries: 10
  workshop:
    build: .
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      DATABASE_URL: postgresql://workshop:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/workshop
      WORKSHOP_ORIGINS: null,file://,http://localhost:5173,http://127.0.0.1:5173
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      WORKSHOP_EMAIL_FROM: ${WORKSHOP_EMAIL_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      WORKSHOP_DOMAIN: ${WORKSHOP_DOMAIN:?Set WORKSHOP_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      workshop:
        condition: service_healthy
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
